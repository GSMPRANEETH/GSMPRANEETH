<svg xmlns="http://www.w3.org/2000/svg" width="900" height="245" viewBox="0 0 900 245" role="img" aria-labelledby="title desc">
  <title id="title">GSM Praneeth</title>
  <desc id="desc">Web apps, AI projects and video editing. Visakhapatnam, India. A small animated workbench sits beside the name.</desc>
  <style>
    .mono{font-family:ui-monospace,Consolas,monospace}.sans{font-family:Arial,Helvetica,sans-serif}
    .orbit{transform-origin:747px 125px;animation:orbit 24s linear infinite}.packet{animation:packet 6s ease-in-out infinite}.cursor{animation:blink 1.5s steps(2,start) infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}@keyframes packet{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes blink{to{opacity:0}}
    @media(prefers-reduced-motion:reduce){.orbit,.packet,.cursor{animation:none}}
  </style>
  <rect width="900" height="245" rx="18" fill="#151613"/>
  <path d="M34 24h832M34 221h832" stroke="#eeeae1" stroke-opacity=".16"/>
  <text x="36" y="51" class="mono" font-size="11" fill="#b0b0a4" letter-spacing="2">GSM / VISAKHAPATNAM, INDIA</text>
  <text x="32" y="132" class="sans" font-size="67" font-weight="800" letter-spacing="-3" fill="#eeeae1">PRANEETH<tspan fill="#ff7547">.</tspan></text>
  <text x="36" y="172" class="mono" font-size="14" fill="#eeeae1">web apps / AI projects / video edits</text>
  <path d="M36 197h145" stroke="#ff7547" stroke-width="3"/>
  <rect x="186" y="189" width="7" height="14" class="cursor" fill="#ff7547"/>
  <circle cx="747" cy="125" r="78" fill="none" stroke="#eeeae1" stroke-opacity=".18"/>
  <circle cx="747" cy="125" r="60" fill="none" stroke="#eeeae1" stroke-opacity=".12" stroke-dasharray="2 8"/>
  <g class="orbit"><circle cx="747" cy="47" r="5" fill="#ff7547"/><circle cx="747" cy="203" r="3" fill="#eeeae1"/></g>
  <g class="packet">
    <rect x="677" y="82" width="140" height="87" rx="8" fill="#242720" stroke="#41463b"/>
    <path d="M677 104h140" stroke="#41463b"/>
    <circle cx="688" cy="94" r="3" fill="#ff7547"/><circle cx="698" cy="94" r="3" fill="#b0b0a4"/>
    <text x="690" y="127" class="mono" font-size="11" fill="#eeeae1">&gt; build</text>
    <text x="690" y="146" class="mono" font-size="11" fill="#b0b0a4">&gt; edit</text>
    <path d="M776 137l8-8 8 8m-16 5 8 8 8-8" fill="none" stroke="#ff7547" stroke-width="2"/>
  </g>
</svg>
